[project]
name = "callpilot"
version = "0.1.0"
description = "Privacy-first, Mac-local AI copilot for two-person calls"
readme = "README.md"
license = "MIT"
authors = [{ name = "Techie Cooks" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "pydantic>=2.7",
    "onnxruntime>=1.30.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["frontend", "docs/pitch"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731", "E741"]
